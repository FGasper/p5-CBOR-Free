on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

env:
    PERL_USE_UNSAFE_INC: 0
    AUTHOR_TESTING: 1
    AUTOMATED_TESTING: 1
    RELEASE_TESTING: 1
    PERL_CARTON_PATH: $GITHUB_WORKSPACE/local

jobs:
  linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.42'
          - '5.40'
          - '5.38'
          - '5.36'
          - '5.34'
          - '5.32'
          - '5.30'
          - '5.28'
          - '5.26'
          - '5.24'
          - '5.22'
          - '5.20'
          - '5.18'
          - '5.16'
          - '5.14'
          - '5.12'
          - '5.10'
        include:
          - perl-version: '5.32'
            os: ubuntu-latest
            coverage: true

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@main
        with:
            submodules: recursive
      - name: perl -V
        run: perl -V
      - name: Install Dependencies
        run: cpanm --notest --installdeps .
      - name: perl Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make
      - name: Run Tests (no coverage)
        if: ${{ !matrix.coverage }}
        run: make test
      - name: Run tests (with coverage)
        if: ${{ matrix.coverage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cpanm -n Devel::Cover::Report::Coveralls
          cover -test -ignore_re easyxs -report Coveralls

  linux-alt-perl:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.020.003'
          - '5.024.004'
          - '5.026.003'
          - '5.028.003'
          - '5.030.003'
          - '5.032.001'
        build-config:
          - main-longdouble-buster
          - main-quadmath-buster

    container:
      image: simcop2387/perl-tester:${{ matrix.perl-version }}-${{ matrix.build-config }}

    steps:
      - uses: actions/checkout@main
        with:
            submodules: recursive
      - run: perl -V
      - name: Tolerate EOL Debian Buster
        run: |
            for f in $(find /etc/apt -name '*.list'); do
                sed -i 's/deb.debian.org/archive.debian.org/g' "$f"
                sed -i 's/security.debian.org/archive.debian.org/g' "$f"
                sed -i '/buster-updates/d' "$f"
                sed -i '/buster-backports/d' "$f"
            done
      - run: cat /etc/apt/sources.list
      - run: apt update
      - run: apt install -y curl
      - run: curl -L https://cpanmin.us | perl - --notest --installdeps .
      - run: perl Makefile.PL
      - run: make
      - run: prove -wlvmb t

  macOS:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@main
        with:
            submodules: recursive
      - name: Set up Perl
        run: brew install perl
      - name: perl -V
        run: perl -V
      - name: Install Dependencies
        run: curl -L https://cpanmin.us | perl - --notest --installdeps .
      - name: perl Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make
      - name: Run Tests
        run: make test

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@main
        with:
            submodules: recursive
      - name: perl -V
        run: perl -V
      - name: Install cpanm
        run: cpan -I App::cpanminus
      - name: Install dependencies
        #run: curl -L https://cpanmin.us | perl - --notest --installdeps .
        run: cpanm --notest --installdeps .
      - name: perl Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make
      - name: Run Tests
        run: make test

  alpine:
    runs-on: ubuntu-latest

    name: Alpine ${{ matrix.docker_arch }}

    strategy:
      fail-fast: false
      matrix:
        docker_arch:
        - i386
        - s390x
        - riscv64
        - ppc64le
        - amd64
        - armhf
        - armv7
        - aarch64

    steps:
      - uses: actions/checkout@main
        with:
            submodules: recursive
      - name: Get the qemu container
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Run tests
        run: docker run --rm --interactive --platform linux/${{ matrix.docker_arch }} --mount type=bind,source=$(pwd),target=/host alpine:latest sh -c "export OPTIMIZE='-O1'; apk update && apk add bash curl wget perl perl-dev make git gcc musl-dev && perl -V && cd /host && curl -L https://cpanmin.us | perl - --notest --installdeps . && perl Makefile.PL && make && prove -wlvmb t"

  qemu:
    runs-on: ubuntu-latest

    name: QEMU (${{ matrix.docker_arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_arch: s390x
            image: ubuntu:22.04
          - docker_arch: arm/v7
            image: ubuntu:20.04
          - docker_arch: 386
            image: debian:bookworm

    steps:
      - uses: actions/checkout@main
        with:
            submodules: recursive
      - name: Get the qemu container
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Run tests on ${{ matrix.platform }}
        run: docker run --rm --interactive --platform linux/${{ matrix.docker_arch }} --mount type=bind,source=$(pwd),target=/host ${{ matrix.image }} bash -c "apt update && apt install -y curl perl make git gcc && perl -V && cd /host && curl -L https://cpanmin.us | perl - --notest --installdeps . && curl -L https://cpanmin.us | perl - --notest CBOR::XS && perl Makefile.PL && make && prove -wlvmb t"
